<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>indexOf EXC1</title>
</head>
<body>
    <script>
        let attempts = 0
        let word = "Carro"
        word = word.toLowerCase();
        for (let i = 0; i < 100000; i++) {
           let letter = prompt(`Digite uma letra. Tentativas 3/${attempts}`)
           letter.toLowerCase()
           if (word.indexOf(letter) == -1) {
            attempts++
            console.log(`Errou tentativas faltando: 3/${attempts}`)
           }
           if (attempts == 3) {
            console.log("Acabou as tentativas");
            exit()
           }
        }
    </script>
</body>
</html>
