<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXC09</title>
</head>
<body>
    
    <script>
        personagemList = [
            {
                nome: "Superman",
                idade: "31",
                peso: "102 kg",
                poder: "Multiplos poderes",
                profissao: "Jornalista",
                foto: "<img src='https://cdn.ome.lt/XaG9HSpvF-NFYYbCLieZAreRMjM=/1200x630/smart/extras/conteudos/supermanvariante_ep1bUK6.jpg'>"
            },
            {
                nome: "Batman",
                idade: "25",
                peso: "95 kg",
                poder: "Rico",
                profissao: "Empressario bilionario",
                foto: "<img src='https://www.cnnbrasil.com.br/wp-content/uploads/sites/12/2022/01/batman-robert-pattinson-2022.jpg?w=1200&h=1200&crop=1'>"
            },
            {
                nome: "Aquaman",
                idade: "38",
                peso: "147 kg",
                poder: "Poderes aquaticos",
                profissao: "Rei da Atlãntida",
                foto: "<img src='https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcROGK0-fYcNNZ6NlwUycr-A9074Qc0hBmbwRQ&s'>"

            }
        ];
        
        for (let i = 0; i < 3; i++) {

        var addNome = prompt("Digite o nome de um personagem: ");
        var addIdade = prompt("Digite a idade de um personagem: ");
        var addPeso = prompt("Digite o peso de um personagem: ");
        var addPoder = prompt("Digite o poder de um personagem: ");
        var addProfissao = prompt("Digite a profissão de um personagem: ");
        var addFoto = prompt("Insira um link da imagem de um personagem: ");

        personagemList.push({nome:addNome, idade:addIdade, peso:addPeso, poder:addPoder, profissao:addProfissao, foto:addFoto});
            
        };

        personagemList.forEach(personagem => {
            document.write(`Nome: ${personagem.nome} - Idade: ${personagem.idade} - Peso: ${personagem.peso} - Poder: ${personagem.poder} - Profissão: ${personagem.profissao} - Foto: ${personagem.foto}`)
        });
    
    </script>
</body>
</html>
