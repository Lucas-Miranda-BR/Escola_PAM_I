<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXC08</title>
</head>
<body>
    <script>
        var escola = [
            {
                professor: "Roberto",
                materia: "TI",
                aluno: "Pedro"

            },
            {
                professor: "Carlos",
                materia: "ADM",
                aluno: "João"
            }
        ]

        var addProf = prompt("Digite o nome de um professor: ");
        var addMateria = prompt("Digite o nome de uma materia: ");
        var addAluno = prompt("Digite o nome de um aluno: ");

        escola.push({professor:addProf, materia:addMateria, aluno:addAluno});

        escola.forEach(coisas => {
            console.log(coisas.professor);
            console.log(coisas.materia);
            console.log(coisas.aluno);
        });
        
    </script>
</body>
</html>
