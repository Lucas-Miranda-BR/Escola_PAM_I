<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXC08</title>
</head>
<body>
    <script>
        var escola = []
        escola['professor'] = ['Roberto', 'Carlos'];
        escola['materia'] = ['Tecnologia da Informação', 'Adminstração de Automoveis'];
        escola['aluno'] = ['Pedro', 'João'];

        var addProf = prompt("Digite o nome de um professor: ");
        escola['professor'].push(addProf);

        var addMateria = prompt("Digite o nome de uma materia: ");
        escola['materia'].push(addMateria);

        var addAluno = prompt("Digite o nome de um aluno: ");
        escola['aluno'].push(addAluno);

        escola.forEach(element => {
            console.log(element)
        });
        
    </script>
</body>
</html>
