<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXC05</title>
</head>
<body>
    <script>
        let array = [10, 20, 30, 40, 50];
        numIndexOf = parseFloat(prompt("Digite um número qualquer: "));

        const pertence = array.indexOf(numIndexOf)
        if (pertence) {
            console.log(`O número: ${numIndexOf} pertence na posição de: ${pertence}.`);
        } else {
            console.log(`O número: ${numIndexOf} não pertence a esta array.`);
            
        }
    </script>
</body>
</html>
